[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nico-channel-downloader"
version = "0.2.0"
description = "Niconico video and collection downloads with optional FFmpeg conversion and metadata cleanup"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = ["yt-dlp[default]>=2026.8.19"]

[project.scripts]
nico-dl = "nico_dl:main"

[tool.setuptools]
py-modules = ["nico_dl", "nico_urls", "nico_backend"]
