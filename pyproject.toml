[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "nico-channel-downloader"
version = "0.4.0"
description = "Niconico, YouTube and Bilibili downloads with optional FFmpeg conversion and metadata cleanup"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
dependencies = ["yt-dlp[default]>=2026.8.19"]

[project.urls]
Homepage = "https://github.com/ykls3417/nico-channel-downloader"
Issues = "https://github.com/ykls3417/nico-channel-downloader/issues"
Releases = "https://github.com/ykls3417/nico-channel-downloader/releases"

[project.scripts]
nico-dl = "nico_dl:main"

[tool.setuptools]
py-modules = ["nico_dl", "nico_urls", "nico_backend"]
